[package]
name = "chime-desktop"
version = "0.1.0"
edition = "2021"
authors = ["Chase Rensberger"]
description = "Local voice dictation by Rensberger"
publish = false

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
chime-engine = { path = "../crates/chime-engine" }
handy-recorder = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time", "macros"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.7"
ashpd = "0.12"
futures-util = "0.3"
gtk = "0.18"
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-global-shortcut = "2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSPanel",
  "NSWindow",
  "NSResponder",
  "NSView",
  "NSBox",
  "NSGraphics",
  "NSColor",
  "NSTextField",
  "NSControl",
  "NSFont",
  "NSScreen",
  "NSEvent",
] }
objc2-foundation = { version = "0.3", features = ["NSTimer", "NSRunLoop"] }
block2 = "0.6"
