name: Linux release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Apply release version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bun run release:prepare "$RELEASE_TAG"
          bun run version:check "$RELEASE_TAG"
      - run: bun run check
      - run: bun run test
      - name: Include the recording overlay runtime
        run: bun scripts/prepare-linux-bundle.ts
      - name: Build and verify Linux packages
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bunx tauri build --config src-tauri/target/overlay-bundle.json --bundles deb,appimage -- --locked
          bash scripts/debian-version.sh src-tauri/target/release/bundle/deb/*.deb "$TAG"
      - name: Upload verified packages to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=()
            [[ "$TAG" != *-* ]] || flags+=(--prerelease)
            gh release create "$TAG" --verify-tag --draft --title "Chime $TAG" --generate-notes \
              --notes "Linux x86_64 (AVX2). Wayland clipboard and paste require wl-clipboard and wtype. Download a speech model in Settings after installation." "${flags[@]}"
          fi
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$TAG" src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage --clobber
