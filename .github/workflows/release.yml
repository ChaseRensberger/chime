name: Linux release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Apply release version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bun run release:prepare "$RELEASE_TAG"
          bun run version:check "$RELEASE_TAG"
      - run: bun run check
      - run: bun run test
      - name: Include the recording overlay runtime
        run: bun scripts/prepare-linux-bundle.ts
      - name: Build and upload Linux packages
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bunx tauri
          args: --config src-tauri/target/overlay-bundle.json --bundles deb,appimage -- --locked
          tagName: ${{ github.ref_name }}
          releaseName: Chime ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generateReleaseNotes: true
          releaseBody: |
            Linux x86_64 packages (AVX2-capable CPU required). Wayland clipboard and paste require wl-clipboard and wtype, plus compositor support for virtual keyboards. The Debian package installs these helpers; AppImage users must install them separately.

            In Settings → Speech model, download the recommended Parakeet Unified English model or import a compatible local GGUF file. The model is not bundled with the app.

            macOS releases are not included yet.
