name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ github.ref_name }}
  publish:
    needs: packages
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Chime-*
          path: packages
          merge-multiple: true
      - name: Upload verified packages and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          files=(packages/Chime_"$version"_{amd64,arm64}.{deb,AppImage} "packages/Chime_${version}_arm64.dmg")
          for file in "${files[@]}"; do test -s "$file"; done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=()
            [[ "$TAG" != *-* ]] || flags+=(--prerelease)
            gh release create "$TAG" --verify-tag --draft --title "Chime $TAG" --generate-notes \
              --notes "Linux x64 (AVX2), Linux ARM64, and macOS Apple silicon. Wayland clipboard and paste require wl-clipboard and wtype. Download a speech model in Settings after installation." "${flags[@]}"
          fi
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$TAG" "${files[@]}" --clobber
          assets=$(gh release view "$TAG" --json assets)
          for file in "${files[@]}"; do
            jq -e --arg name "${file##*/}" --argjson size "$(stat -c %s "$file")" \
              'any(.assets[]; .name == $name and .state == "uploaded" and .size == $size)' <<< "$assets" >/dev/null
          done
          gh release edit "$TAG" --draft=false
