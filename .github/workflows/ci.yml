name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_tag:
        description: Version for the local test artifact
        default: v0.0.1
        required: true

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ inputs.test_tag || '' }}
  hero:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hero
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
